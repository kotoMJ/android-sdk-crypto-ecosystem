name: CI Pipeline

# When this action should run
on:
  # Run on pushes to the 'main' branch
  push:
    branches: [ "main" ]

  # Run on ALL pull requests
  pull_request:

jobs:
  build:
    name: CodeGuard
    runs-on: ubuntu-latest

    env:
      BFF_CRYPTO_ADMIN_BYPASS_SECRET: ${{ secrets.BFF_CRYPTO_ADMIN_BYPASS_SECRET }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # This tells the action to get all history and tags

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Caches Gradle dependencies for faster builds

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # REQUIRED: Enable KVM for hardware acceleration
      # Without this, GMD will fail or be extremely slow
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # --- STEP 1: SPOTLESS ---
      - name: Check Spotless
        id: spotless
        continue-on-error: true  # Allows pipeline to continue even if this fails
        run: ./gradlew spotlessCheck

      - name: Badge Spotless
        if: always() && github.ref == 'refs/heads/main' # <--- generate badge only on main as there is just one gist for badges.
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.BADGE_GIST_TOKEN }}
          gistID: ${{ secrets.BADGE_GIST_ID }}
          filename: badge-spotless.json
          label: Spotless
          message: ${{ steps.spotless.outcome }}
          color: ${{ steps.spotless.outcome == 'success' && 'success' || 'critical' }}

      # --- STEP 2: DETEKT ---
      - name: Check Detekt
        id: detekt
        continue-on-error: true
        run: ./gradlew detekt

      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: "**/build/reports/detekt/detekt.html"

      - name: Badge Detekt
        if: always() && github.ref == 'refs/heads/main' # <--- generate badge only on main as there is just one gist for badges.
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.BADGE_GIST_TOKEN }}
          gistID: ${{ secrets.BADGE_GIST_ID }}
          filename: badge-detekt.json
          label: Detekt
          message: ${{ steps.detekt.outcome }}
          color: ${{ steps.detekt.outcome == 'success' && 'success' || 'critical' }}

      # --- STEP 3: MODULE VERSIONS ---
      - name: Check Module Versions
        id: versions
        continue-on-error: true
        run: ./gradlew checkModuleVersions

      - name: Badge Module Versions
        if: always() && github.ref == 'refs/heads/main' # <--- generate badge only on main as there is just one gist for badges.
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.BADGE_GIST_TOKEN }}
          gistID: ${{ secrets.BADGE_GIST_ID }}
          filename: badge-module-versions.json
          label: Unit Tests
          message: ${{ steps.versions.outcome }}
          color: ${{ steps.versions.outcome == 'success' && 'success' || 'critical' }}

      # --- STEP 4: UNIT TESTS ---
      - name: Check Unit Tests
        id: unit
        continue-on-error: true
        run: ./gradlew testDebug

      - name: Upload Unit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/reports/tests/test*UnitTest/"

      - name: Badge Unit Tests
        if: always() && github.ref == 'refs/heads/main' # <--- generate badge only on main as there is just one gist for badges.
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.BADGE_GIST_TOKEN }}
          gistID: ${{ secrets.BADGE_GIST_ID }}
          filename: badge-tests-unit.json
          label: Unit Tests
          message: ${{ steps.unit.outcome }}
          color: ${{ steps.unit.outcome == 'success' && 'success' || 'critical' }}

      # --- STEP 5: INSTRUMENTED TESTS ---
      - name: Check Managed Device Tests
        id: instr
        continue-on-error: true
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dkotlin.daemon.jvm.options=-Xmx2g"
        run: ./gradlew pixel4api35aospatdCheck

      - name: Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: "**/build/reports/androidTests/managedDevice/*/"

      - name: Badge Instrumented
        if: always() && github.ref == 'refs/heads/main' # <--- generate badge only on main as there is just one gist for badges.
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.BADGE_GIST_TOKEN }}
          gistID: ${{ secrets.BADGE_GIST_ID }}
          filename: badge-tests-instr.json
          label: Instrumented
          message: ${{ steps.instr.outcome }}
          color: ${{ steps.instr.outcome == 'success' && 'success' || 'critical' }}

      # --- FINAL CHECK ---
      - name: Check Final Status
        if: always()
        run: |
          echo "# 🛡️ CodeGuard Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "Verification complete. Detailed reports are available in the **Artifacts** section at the bottom of this page." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 🚨 API UNAVAILABILITY DISCLAIMER 🚨
          if [ "${{ steps.instr.outcome }}" == "failure" ]; then
            echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
            echo "> **Note on Instrumented Tests:** These tests rely on a live API connection. If you see network-related failures, please verify if the staging/test API is currently reachable before debugging code changes." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| Quality Gate | Status | Diagnostic Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          FAILED=false
          
          # Defined as: "Display Name | Step Outcome | Artifact Name"
          CHECKS=(
            "Spotless|${{ steps.spotless.outcome }}|📄 _Check workflow logs_"
            "Detekt|${{ steps.detekt.outcome }}|📦 **detekt-report**"
            "Module Versions|${{ steps.versions.outcome }}|📄 _Check workflow logs_"
            "Unit Tests|${{ steps.unit.outcome }}|📦 **unit-test-results**"
            "Instrumented|${{ steps.instr.outcome }}|📦 **instrumented-test-results**"
          )

          for entry in "${CHECKS[@]}"; do
            IFS='|' read -r NAME OUTCOME REPORT <<< "$entry"
          
            if [ "$OUTCOME" == "failure" ]; then
              echo "| \`$NAME\` | ❌ **FAILED** | $REPORT |" >> $GITHUB_STEP_SUMMARY
              echo "::error title=CodeGuard Failure::$NAME failed."
              FAILED=true
            else
              echo "| \`$NAME\` | ✅ Passed | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$FAILED" = true ]; then
            echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
            echo "> **Action Required:** One or more quality gates failed. Review the table above to identify the issue." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
            echo "> **All Clear:** Your code meets all quality standards." >> $GITHUB_STEP_SUMMARY
          fi